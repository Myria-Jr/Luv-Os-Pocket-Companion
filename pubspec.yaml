name: luv_os
description: "LUV.OS // Pocket Companion - Interactive Psychological Cute-Core Horror Game."
publish_to: 'none'
version: 4.0.0+10

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  sensors_plus: ^5.0.1
  battery_plus: ^6.0.1
  flutter_local_notifications: ^17.1.2
  camera: ^0.12.2
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.10

flutter:
  uses-material-design: true
  shaders:
    - shaders/yandere_glitch.frag
